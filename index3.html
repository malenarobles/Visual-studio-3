  // Supongamos que tenemos un arreglo de objetos que representan productos en un inventario de una 
  // tienda, y queremos filtrar solo los productos que estan agotados (es decir, aquellos que tienen una
  // cantidad en stock igual a cero). Ademas, queremos obtener un nuevo arreglo que contenga solo los
  // nombres de los productos agotados junto con su categoría.

  const inventario = [
    {nombre: "Camisa", categoria: "Ropa", stock: 10},
    {nombre: "Pantalón", categoria: "Ropa", stock: 0},
    {nombre: "Zapatos", categoria: "Calzado", stock: 0},
    {nombre: "Teléfono", categoria: "Electrónica", stock: 5},
    {nombre: "Tablet", categoria: "Electrónica", stock: 0},
  ];

  // Usar filter
  const productosAgotados = inventario.filter((producto) => producto.stock === 0);

  // Usar map
  const nombresYcategorias = productosAgotados.map((producto) => ({
    nombre: producto.nombre,
    categoria: producto.categoria
  }))

  console.log(nombresYcategorias);

  // Función mas compleja
  const personas = [
    { nombre: "Juan", edad: 25},
    { nombre: "María", edad: 17},
    { nombre: "Carols", edad: 30},
    { nombre: "Laura", edad: 20},
    { nombre: "Pedro", edad: 14},
  ];

  // funcion flecha para calcular el promedio de edDES
  const calcularPromedioEdades = (personas) => {
    let sumaEdades = 0;

    for (let persona of personas) {
      sumaEdades += persona.edad;
    }

    return sumaEdades / personas.lenght;
  };

  const promedioEdades = calcularPromedioEdades(personas);
